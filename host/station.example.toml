# remkey station service config (shack PC). Copy to station.toml and edit.

# Shared secret: same string in client.toml. Generate with:  python -m remkey.genkey
secret = "CHANGE-ME-run-python-m-remkey-genkey"

# 127.0.0.1 = reachable only through a local forwarder: Tailscale Serve
#             (recommended; see docs/remote-access-tailscale-nordvpn.md) or an
#             AnyDesk TCP tunnel. Nothing exposed on the LAN or router.
# 0.0.0.0   = reachable on every adapter (router port-forward).
listen_host = "127.0.0.1"
listen_port = 7373

# The station Nano's COM port (Device Manager -> Ports). Not the SO2R+, not the 7610.
keyer_port = "COM7"
keyer_baud = 115200

# No traffic from the client for this long -> PTT off, queued text flushed.
heartbeat_timeout_s = 3.0

# After you turn PTT off, the station keys out any queued CW, then holds PTT this
# long (any CW arriving meanwhile is sent and restarts the hold). Safety stops
# (link lost, heartbeat lost, Nano watchdog) are always immediate.
ptt_hang_ms = 2000

# Station re-keys a little faster than you send so its buffer never piles up.
wpm_offset = 2

# Longest tune carrier a client may request (ms).
max_tune_ms = 15000

log_file = "remkey-station.log"

# ---------------------------------------------------------------------------
# Tower telemetry (remtlm). Leave tlm_port empty to disable.
# One receiver (the BASE Nano) hears both remtlm senders: the tower-top box
# and the supply box at the tower base.
# ---------------------------------------------------------------------------
# COM port of the remtlm BASE Nano in the radio room
tlm_port = ""
tlm_baud = 115200

# PA power-sense calibration: [mV at the PA sense pin, watts at the PA output].
# Measure with a power meter (see README "Calibrating the PA power sense").
# Leave empty to see raw mV only.
pa_cal = [
  # [0, 0.0],
  # [800, 1.0],
  # [2200, 5.0],
  # [3400, 10.0],
]

# Same for the MKU 10 G5 MON output, CON1 pin 9 (optional)
xv_cal = []

# Names for DS18B20 probe 1 and probe 2 (bus order is by probe serial number;
# warm one in your hand while watching tlmview to see which is which)
temp_names = ["PA heatsink", "transverter case"]

# Alert thresholds (each clears 3 C below). The MKU 10 G5 is rated +55 C case
# and disables TX above +65 C.
temp_warn_c = 65.0
temp2_warn_c = 50.0

# Alert if no packet arrives for this long (tower-top box and supply box, separately)
tlm_stale_s = 10.0

# One row per packet, for heatsink-temperature history etc. Empty = off.
tlm_csv = "remkey-tlm.csv"

# ---------------------------------------------------------------------------
# Supply monitor: INA226 + shunt in the supply box at the tower base (remtlm PSU
# Nano), and optionally a second one in the tower-top box (PWR_ENABLE 1)
# ---------------------------------------------------------------------------
# What the supply is set to. Only used when the top box measures and the base
# box doesn't; with the base box, the supply voltage is measured.
base_supply_v = 14.1

# One-way cable length, tower base to the enclosure (for the wire-gauge check)
cable_one_way_ft = 100

# DS18B20 in the supply box: name and alert threshold (clears 3 C below; 0 = off)
box_temp_name = "supply box"
box_temp_warn_c = 50.0

# Trim to a DMM at the INA226 / a clamp meter (measured / displayed)
v_scale = 1.0
i_scale = 1.0

# Alerts. 0 turns one off. Leave the current limits at 0 until you know what's
# normal, then run:  python -m remkey.powerstats remkey-tlm.csv --config station.toml
# The voltage limits apply to each INA226 (labelled "at tower base" / "tower-top").
# With only the base box, v_min_alert checks the supply's own output: 12.0 is the
# MKU 10 G5's minimum at the top, so set it nearer 13.5 until a top INA226 exists.
v_min_alert = 12.0
v_max_alert = 14.3
i_max_alert = 0.0      # peak current above this
i_min_alert = 0.0      # average current below this (something in the box lost power)

# ---------------------------------------------------------------------------
# Web dashboard: live telemetry page for another computer or tablet in the
# radio room (README section 9, "Web dashboard"). 0 = off.
# Also allow the port through Windows Firewall once (see the README).
# ---------------------------------------------------------------------------
dash_port = 8080
# dash_host = "0.0.0.0"                 # all adapters
# dash_allow = ["192.168.1.0/24", "100.64.0.0/10"]   # default: home LAN ranges + Tailscale
# dash_hostnames = []                   # extra names to accept besides IPs and machine names
# dash_history_h = 12                   # hours of chart history kept in memory

# ---------------------------------------------------------------------------
# Cloud copy of the dashboard (README section 9, "Cloud copy"). Empty = off.
# cloud/deploy.sh on the Mac prints the bucket name and makes the upload key;
# needs boto3: in the host folder run  .\Install-remkey.bat cloud
# ---------------------------------------------------------------------------
cloud_bucket = ""
# cloud_region = "us-east-1"
# cloud_profile = "remkey-tlm"          # profile in %USERPROFILE%\.aws\credentials
