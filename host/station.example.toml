# remkey station service config (shack PC). Copy to station.toml and edit.

# Shared secret: same string in client.toml. Generate with:  python -m remkey.genkey
secret = "CHANGE-ME-run-python-m-remkey-genkey"

# 0.0.0.0 = reachable through a router port-forward.
# 127.0.0.1 = only reachable through an AnyDesk TCP tunnel (nothing exposed on the router).
listen_host = "0.0.0.0"
listen_port = 7373

# The station Nano's COM port (Device Manager -> Ports). Not the SO2R+, not the 7610.
keyer_port = "COM7"
keyer_baud = 115200

# No traffic from the client for this long -> PTT off, queued text flushed.
heartbeat_timeout_s = 3.0

# After you turn PTT off, the station keys out any queued CW, then holds PTT this
# long (any CW arriving meanwhile is sent and restarts the hold). Safety stops
# (link lost, heartbeat lost, Nano watchdog) are always immediate.
ptt_hang_ms = 2000

# Station re-keys a little faster than you send so its buffer never piles up.
wpm_offset = 2

# Longest tune carrier a client may request (ms).
max_tune_ms = 15000

log_file = "remkey-station.log"

# ---------------------------------------------------------------------------
# Tower telemetry (remtlm). Leave tlm_port empty to disable.
# ---------------------------------------------------------------------------
# COM port of the remtlm BASE Nano in the radio room
tlm_port = ""
tlm_baud = 115200

# PA power-sense calibration: [mV at the PA sense pin, watts at the PA output].
# Measure with a power meter (see README "Calibrating the PA power sense").
# Leave empty to see raw mV only.
pa_cal = [
  # [0, 0.0],
  # [800, 1.0],
  # [2200, 5.0],
  # [3400, 10.0],
]

# Same for the MKU 10 G5 MON output, CON1 pin 9 (optional)
xv_cal = []

# Names for DS18B20 probe 1 and probe 2 (bus order is by probe serial number;
# warm one in your hand while watching tlmview to see which is which)
temp_names = ["PA heatsink", "transverter case"]

# Alert thresholds (each clears 3 C below). The MKU 10 G5 is rated +55 C case
# and disables TX above +65 C.
temp_warn_c = 65.0
temp2_warn_c = 50.0

# Alert if no telemetry packet arrives for this long
tlm_stale_s = 10.0

# One row per packet, for heatsink-temperature history etc. Empty = off.
tlm_csv = "remkey-tlm.csv"

# ---------------------------------------------------------------------------
# Tower supply monitor (INA226 in the transverter enclosure)
# ---------------------------------------------------------------------------
# What the supply at the tower base is set to; the drop is measured against it
base_supply_v = 14.1

# One-way cable length, tower base to the enclosure (for the wire-gauge check)
cable_one_way_ft = 100

# Trim to a DMM at the enclosure / a clamp meter (measured / displayed)
v_scale = 1.0
i_scale = 1.0

# Alerts. 0 turns one off. Leave the current limits at 0 until you know what's
# normal, then run:  python -m remkey.powerstats remkey-tlm.csv --config station.toml
v_min_alert = 12.0     # MKU 10 G5 minimum supply rating
v_max_alert = 14.3
i_max_alert = 0.0      # peak current above this
i_min_alert = 0.0      # average current below this (something in the box lost power)
