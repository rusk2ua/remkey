[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "remkey"
version = "0.8.0"
description = "Remote CW keying with local sidetone: Arduino Nano keyers + Python bridge"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rus Healy, K2UA" }]
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-asyncio>=0.23", "pytest-timeout>=2"]
cloud = ["boto3>=1.28"]

[project.scripts]
remkey-station = "remkey.station:main"
remkey-client = "remkey.client:main"

[tool.setuptools]
packages = ["remkey"]

[tool.setuptools.package-data]
remkey = ["web/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60                 # a hung test fails (and is named) instead of eating the CI job
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
