<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="610" viewBox="0 0 1600 610" font-family="Helvetica, Arial, sans-serif">
<title>remkey: how remote paddle CW works</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect width="1600" height="610" fill="white"/>
<text x="800" y="36" font-size="24" font-weight="bold" font-style="normal" fill="#1f2933" text-anchor="middle">remkey: remote paddle CW</text>
<text x="800" y="60" font-size="14" font-weight="normal" font-style="italic" fill="#52606d" text-anchor="middle">Characters cross the internet, not key-down timing, so jitter can't chop your dits and dahs</text>
<rect x="20" y="80" width="600" height="390" rx="14" fill="#eaf2fb" stroke="#3b6fb6" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="34" y="104" font-size="15" font-weight="bold" font-style="normal" fill="#3b6fb6" text-anchor="start">TRAVEL END</text>
<text x="34" y="122" font-size="12" font-weight="normal" font-style="italic" fill="#52606d" text-anchor="start">anywhere with internet</text>
<rect x="640" y="80" width="170" height="390" rx="14" fill="#f2f2f2" stroke="#7b8794" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="654" y="104" font-size="15" font-weight="bold" font-style="normal" fill="#7b8794" text-anchor="start">INTERNET</text>
<rect x="830" y="80" width="580" height="390" rx="14" fill="#eaf6ee" stroke="#2f8a4e" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="844" y="104" font-size="15" font-weight="bold" font-style="normal" fill="#2f8a4e" text-anchor="start">SHACK</text>
<text x="844" y="122" font-size="12" font-weight="normal" font-style="italic" fill="#52606d" text-anchor="start">Windows PC, IC-7610</text>
<rect x="1430" y="80" width="150" height="390" rx="14" fill="#fdf3e3" stroke="#c27c0e" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1444" y="104" font-size="15" font-weight="bold" font-style="normal" fill="#c27c0e" text-anchor="start">TOWER</text>
<rect x="40" y="160" width="160" height="160" rx="8" fill="white" stroke="#3b6fb6" stroke-width="2"/>
<text x="120.0" y="184" font-size="15" font-weight="bold" font-style="normal" fill="#1f2933" text-anchor="middle">Paddle + PTT</text>
<text x="120.0" y="206" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">iambic paddle</text>
<text x="120.0" y="223" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle"></text>
<text x="120.0" y="240" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">PTT button</text>
<text x="120.0" y="257" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">or toggle switch</text>
<rect x="240" y="160" width="160" height="160" rx="8" fill="white" stroke="#3b6fb6" stroke-width="2"/>
<text x="320.0" y="184" font-size="15" font-weight="bold" font-style="normal" fill="#1f2933" text-anchor="middle">Client Nano</text>
<text x="320.0" y="206" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">iambic keyer</text>
<text x="320.0" y="223" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">local sidetone,</text>
<text x="320.0" y="240" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">zero delay</text>
<text x="320.0" y="257" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">decodes each</text>
<text x="320.0" y="274" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">character you send</text>
<circle cx="398" cy="162" r="13" fill="#3b6fb6"/>
<text x="398" y="167" font-size="14" font-weight="bold" font-style="normal" fill="white" text-anchor="middle">1</text>
<rect x="440" y="160" width="160" height="160" rx="8" fill="white" stroke="#3b6fb6" stroke-width="2"/>
<text x="520.0" y="184" font-size="15" font-weight="bold" font-style="normal" fill="#1f2933" text-anchor="middle">Mac client</text>
<text x="520.0" y="206" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">remkey.client</text>
<text x="520.0" y="223" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle"></text>
<text x="520.0" y="240" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">keyboard CW, hotkeys</text>
<text x="520.0" y="257" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">heartbeat</text>
<text x="520.0" y="274" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">tower readouts</text>
<rect x="850" y="160" width="170" height="160" rx="8" fill="white" stroke="#2f8a4e" stroke-width="2"/>
<text x="935.0" y="184" font-size="15" font-weight="bold" font-style="normal" fill="#1f2933" text-anchor="middle">Station service</text>
<text x="935.0" y="206" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">remkey.station</text>
<text x="935.0" y="223" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle"></text>
<text x="935.0" y="240" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">checks the client's</text>
<text x="935.0" y="257" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">HMAC login</text>
<text x="935.0" y="274" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">safety stops on</text>
<text x="935.0" y="291" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">link loss</text>
<rect x="1060" y="160" width="160" height="160" rx="8" fill="white" stroke="#2f8a4e" stroke-width="2"/>
<text x="1140.0" y="184" font-size="15" font-weight="bold" font-style="normal" fill="#1f2933" text-anchor="middle">Station Nano</text>
<text x="1140.0" y="206" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">re-sends each</text>
<text x="1140.0" y="223" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">character with</text>
<text x="1140.0" y="240" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">exact timing</text>
<text x="1140.0" y="257" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">PTT release hold</text>
<text x="1140.0" y="274" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">3 s watchdog</text>
<circle cx="1218" cy="162" r="13" fill="#2f8a4e"/>
<text x="1218" y="167" font-size="14" font-weight="bold" font-style="normal" fill="white" text-anchor="middle">3</text>
<rect x="1260" y="160" width="130" height="160" rx="8" fill="white" stroke="#2f8a4e" stroke-width="2"/>
<text x="1325.0" y="184" font-size="15" font-weight="bold" font-style="normal" fill="#1f2933" text-anchor="middle">IC-7610</text>
<text x="1325.0" y="206" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle"></text>
<text x="1325.0" y="223" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">KEY jack</text>
<text x="1325.0" y="240" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">(CW)</text>
<text x="1325.0" y="257" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle"></text>
<text x="1325.0" y="274" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">SEND line</text>
<text x="1325.0" y="291" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">(PTT)</text>
<rect x="1445" y="160" width="120" height="160" rx="8" fill="white" stroke="#c27c0e" stroke-width="2"/>
<text x="1505.0" y="184" font-size="15" font-weight="bold" font-style="normal" fill="#1f2933" text-anchor="middle">10 GHz</text>
<text x="1505.0" y="202" font-size="15" font-weight="bold" font-style="normal" fill="#1f2933" text-anchor="middle">transverter</text>
<text x="1505.0" y="224" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle"></text>
<text x="1505.0" y="241" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">and PA</text>
<text x="1505.0" y="258" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle"></text>
<text x="1505.0" y="275" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">keyed from</text>
<text x="1505.0" y="292" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">the 7610's</text>
<text x="1505.0" y="309" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">SEND line</text>
<path d="M200,235 L240,235" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#ah)"/>
<path d="M400,235 L440,235" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#ah)"/>
<text x="420.0" y="225.0" font-size="12.5" font-weight="normal" font-style="normal" fill="#1f2933" text-anchor="middle" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">USB</text>
<path d="M600,235 L850,235" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="725" cy="150" r="13" fill="#7b8794"/>
<text x="725" y="155" font-size="14" font-weight="bold" font-style="normal" fill="white" text-anchor="middle">2</text>
<text x="725" y="180" font-size="12.5" font-weight="normal" font-style="normal" fill="#1f2933" text-anchor="middle">characters, PTT,</text>
<text x="725" y="197" font-size="12.5" font-weight="normal" font-style="normal" fill="#1f2933" text-anchor="middle">heartbeats</text>
<text x="725" y="259" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">TCP + JSON</text>
<text x="725" y="276" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">over Tailscale</text>
<text x="725" y="293" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">(or port-forward)</text>
<path d="M1020,235 L1060,235" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#ah)"/>
<text x="1040.0" y="225.0" font-size="12.5" font-weight="normal" font-style="normal" fill="#1f2933" text-anchor="middle" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">USB</text>
<path d="M1220,210 L1260,210" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#ah)"/>
<text x="1240.0" y="202.0" font-size="11.5" font-weight="normal" font-style="normal" fill="#1f2933" text-anchor="middle" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">opto</text>
<path d="M1220,275 L1260,275" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#ah)"/>
<text x="1240.0" y="267.0" font-size="11.5" font-weight="normal" font-style="normal" fill="#1f2933" text-anchor="middle" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">opto</text>
<path d="M1390,275 L1445,275" fill="none" stroke="#1f2933" stroke-width="2" marker-end="url(#ah)"/>
<path d="M1140,320 L1140,360 L320,360 L320,320" fill="none" stroke="#52606d" stroke-width="2" marker-end="url(#ahg)"/>
<text x="730.0" y="350.0" font-size="12" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">PTT confirmed: the client's PTT LED lights</text>
<path d="M1325,320 L1325,410 L520,410 L520,320" fill="none" stroke="#52606d" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#ahg)"/>
<text x="922.5" y="400.0" font-size="12" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle" stroke="white" stroke-width="5" stroke-linejoin="round" paint-order="stroke">receive audio by AnyDesk, with the radio's own sidetone (delayed)</text>
<text x="1120" y="458" font-size="12" font-weight="normal" font-style="italic" fill="#52606d" text-anchor="middle">N1MM+, rig and rotator control: unchanged, by AnyDesk</text>
<circle cx="60" cy="510" r="13" fill="#3b6fb6"/>
<text x="60" y="515" font-size="14" font-weight="bold" font-style="normal" fill="white" text-anchor="middle">1</text>
<text x="82" y="515" font-size="15" font-weight="bold" font-style="normal" fill="#1f2933" text-anchor="start">You hear yourself instantly.</text>
<text x="82" y="536" font-size="13" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="start">The travel Nano is a normal keyer with its own sidetone.</text>
<circle cx="580" cy="510" r="13" fill="#7b8794"/>
<text x="580" y="515" font-size="14" font-weight="bold" font-style="normal" fill="white" text-anchor="middle">2</text>
<text x="602" y="515" font-size="15" font-weight="bold" font-style="normal" fill="#1f2933" text-anchor="start">Only characters cross the network.</text>
<text x="602" y="536" font-size="13" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="start">Jitter delays a whole character, never an element.</text>
<circle cx="1100" cy="510" r="13" fill="#2f8a4e"/>
<text x="1100" y="515" font-size="14" font-weight="bold" font-style="normal" fill="white" text-anchor="middle">3</text>
<text x="1122" y="515" font-size="15" font-weight="bold" font-style="normal" fill="#1f2933" text-anchor="start">The shack re-times them perfectly.</text>
<text x="1122" y="536" font-size="13" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="start">About one character behind you; safety stops drop PTT at once.</text>
<text x="800" y="592" font-size="12.5" font-weight="normal" font-style="normal" fill="#52606d" text-anchor="middle">Safety: link closed, no heartbeat for 3 s, or the station PC/USB hangs (Nano watchdog) → PTT off and queued CW flushed immediately</text>
</svg>
