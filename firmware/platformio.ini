; Optional: build/upload with PlatformIO (VS Code extension) instead of the Arduino IDE.
;   pio run -e client -t upload --upload-port /dev/cu.usbserial-XXXX
;   pio run -e station -t upload --upload-port COM7
; For Nano clones with the old bootloader, change board to nanoatmega328 (old) by
; setting: board_upload.speed = 57600

[platformio]
src_dir = remkey

[env]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 115200

[env:client]
build_flags = -DREMKEY_ROLE=1

[env:station]
build_flags = -DREMKEY_ROLE=2
