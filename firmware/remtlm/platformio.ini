; Optional PlatformIO build for remtlm (run from this folder):
;   pio run -e tower -t upload --upload-port /dev/cu.usbserial-XXXX
;   pio run -e base  -t upload --upload-port COM9
; Arduino IDE users: ignore this file; install the three libraries listed in remtlm.ino.

[platformio]
src_dir = .

[env]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 115200
lib_deps =
  xreef/EByte LoRa E220 library
  paulstoffregen/OneWire
  milesburton/DallasTemperature

[env:tower]
build_flags = -DREMTLM_ROLE=1

[env:base]
build_flags = -DREMTLM_ROLE=2
